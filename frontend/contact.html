<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIVORA AI Portal - Assistance Matrix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="h-16 bg-slate-900/80 backdrop-blur-xl border-b border-slate-800 flex justify-between items-center px-6 md:px-10 sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center font-black text-xl text-white shadow-lg shadow-indigo-500/25">
        🤖
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <span class="font-black text-lg text-white">VIVORA</span>
          <span class="bg-indigo-600 text-white text-[10px] font-black px-1.5 py-0.5 rounded">AI</span>
        </div>
        <p className="text-[10px] text-slate-400 font-bold uppercase">Assistance Matrix</p>
      </div>
    </div>
    <a href="/" class="border border-slate-700 bg-slate-800/80 hover:bg-indigo-600 hover:text-white rounded-xl px-4 py-2 font-bold text-xs transition-all shadow-sm">
      ← Return to Portal
    </a>
  </header>

  <!-- Main Content -->
  <div class="flex flex-1 justify-center items-center p-6 md:p-12 relative overflow-hidden">
    
    <!-- Glow Backdrop -->
    <div class="absolute -right-20 -top-20 w-96 h-96 bg-indigo-500/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -left-20 -bottom-20 w-96 h-96 bg-purple-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <main class="max-w-xl w-full space-y-6 relative z-10">
      <div class="text-center space-y-2">
        <div class="inline-flex items-center gap-2 px-3 py-1 bg-indigo-500/10 border border-indigo-500/30 rounded-full text-xs font-bold text-indigo-300">
          <span>⚡ 24/7 Platform Telemetry Support</span>
        </div>
        <h2 class="text-3xl md:text-4xl font-black text-white tracking-tight">Platform Assistance Matrix</h2>
        <p class="text-slate-400 text-xs md:text-sm font-medium">Encountering anomalies? Dispatch an analytical support ticket node.</p>
      </div>

      <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
        <form id="contact-form" class="space-y-4" onsubmit="alert('✓ Ticket dispatched to telemetry node!'); this.reset(); return false;">
          <div class="space-y-1.5">
            <label class="block font-black text-xs uppercase tracking-wider text-slate-300">Issue Category</label>
            <select class="w-full p-3.5 border border-slate-700 rounded-2xl bg-slate-800/80 font-bold text-xs text-white outline-none focus:border-indigo-500">
              <option>Web Speech API Voice Synthesis Interruption</option>
              <option>Microphone Speech-to-Text Input Issue</option>
              <option>Webcam Biometric Feed Not Initializing</option>
              <option>OpenRouter LLM Connectivity / Latency</option>
              <option>MongoDB Historical Session Persistence</option>
            </select>
          </div>
          <div class="space-y-1.5">
            <label class="block font-black text-xs uppercase tracking-wider text-slate-300">Detailed Description</label>
            <textarea required class="w-full h-32 p-3.5 border border-slate-700 rounded-2xl bg-slate-800/80 font-medium text-xs text-white outline-none focus:border-indigo-500" placeholder="Provide system details, error output, or reproduction steps..."></textarea>
          </div>
          <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-black p-3.5 rounded-2xl shadow-lg shadow-indigo-500/25 transition-all text-xs">
            Dispatch Support Ticket Node
          </button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
